version: '3.9'

services:
  postgres-db:
    image: postgres:latest
    container_name: postgres-db
    ports:
      - 5432:5432
    volumes:
      - postgres-db-vol:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=XPTO123
      - POSTGRES_USER=XPTO
      - POSTGRES_DB=store

  api:
    container_name: api
    image: api-go:latest
    build: 
      context: ./api
    ports:
      - 8080:8080
    environment:
      - POSTGRES_PASSWORD=XPTO123
      - POSTGRES_USER=XPTO
      - POSTGRES_DB=store

volumes:
  postgres-db-vol:
    driver: local